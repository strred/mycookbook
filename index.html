<!DOCTYPE html>
<html lang="hu">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Receptfüzet</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<style>
  :root{--paper:#F6F1E7;--paper-2:#EFE7D7;--ink:#23201C;--ink-soft:#5D564B;--herb:#33503F;
    --herb-deep:#24382C;--honey:#D89A2E;--honey-soft:#F3E4C2;--berry:#7A3B52;--rule:rgba(35,32,28,.14);--spine:var(--herb);}
  *{box-sizing:border-box} html{-webkit-text-size-adjust:100%}
  body{margin:0;background:var(--paper);color:var(--ink);font-family:"Newsreader",Georgia,serif;font-size:18px;line-height:1.6;font-optical-sizing:auto;}
  .wrap{max-width:1060px;margin:0 auto;padding:0 24px}
  header.masthead{padding:52px 0 20px}
  .wordmark{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:clamp(2.6rem,8vw,4.6rem);
    line-height:.92;letter-spacing:-.02em;margin:0;color:var(--herb-deep);cursor:pointer;background:none;border:0;text-align:left;padding:0;}
  .wordmark:focus-visible{outline:3px solid var(--honey);outline-offset:4px}
  .tagline{margin:12px 0 0;max-width:52ch;color:var(--ink-soft);font-size:1.05rem}
  /* nav */
  nav.nav{display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-bottom:2px solid var(--ink);padding:0 0 0;margin-top:20px}
  .tab{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:.98rem;background:none;border:0;cursor:pointer;
    color:var(--ink-soft);padding:12px 4px;margin-bottom:-2px;border-bottom:3px solid transparent;text-decoration:none;display:inline-flex;align-items:center;gap:8px}
  .tab.active{color:var(--herb-deep);border-bottom-color:var(--herb)}
  .tab:focus-visible{outline:2.5px solid var(--honey);outline-offset:2px}
  .tab.right{margin-left:auto;color:var(--herb);font-size:.85rem;font-weight:600}
  .badge{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:.72rem;background:var(--herb);color:var(--paper);
    border-radius:100px;min-width:20px;height:20px;padding:0 6px;display:inline-flex;align-items:center;justify-content:center}
  .badge.zero{display:none}
  /* controls */
  .controls{padding:22px 0 8px}
  .search{display:flex;align-items:center;gap:12px;border:1.5px solid var(--ink);background:var(--paper);border-radius:2px;padding:12px 16px;max-width:440px;}
  .search svg{flex:none;stroke:var(--ink-soft)}
  .search input{border:0;background:none;outline:none;width:100%;font-family:"Newsreader",serif;font-size:1.05rem;color:var(--ink);}
  .search input::placeholder{color:var(--ink-soft);opacity:.75}
  .tagbar{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}
  .tagfilter{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.85rem;background:none;color:var(--ink-soft);
    border:1.5px solid var(--rule);border-radius:100px;padding:5px 14px;cursor:pointer;}
  .tagfilter[aria-pressed="true"]{background:var(--herb);color:var(--paper);border-color:var(--herb)}
  .tagfilter:focus-visible{outline:2.5px solid var(--honey);outline-offset:2px}
  main{padding:8px 0 80px}
  .index{list-style:none;margin:20px 0 0;padding:0}
  .card{display:flex;gap:18px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;cursor:pointer;
    padding:24px 20px 24px 24px;border-top:1px solid var(--rule);border-left:5px solid var(--spine);font-family:inherit;color:inherit;}
  .index li:last-child .card{border-bottom:1px solid var(--rule)}
  .card:hover{background:var(--paper-2)}
  .card:focus-visible{outline:3px solid var(--honey);outline-offset:-3px}
  .card-txt{flex:1;min-width:0}
  .card h2{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:clamp(1.35rem,3.3vw,1.8rem);line-height:1.08;letter-spacing:-.01em;margin:0;color:var(--herb-deep);}
  .card p.desc{margin:8px 0 0;color:var(--ink-soft);max-width:60ch}
  .card .meta{display:flex;flex-wrap:wrap;gap:8px 14px;margin-top:14px;align-items:center}
  .card .thumb{flex:none;width:88px;height:88px;object-fit:cover;border-radius:3px;border:1px solid var(--rule);background:var(--paper-2)}
  .card .playtag{flex:none;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.72rem;color:var(--ink-soft);display:inline-flex;align-items:center;gap:4px}
  .chip{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.78rem;color:var(--spine);display:inline-flex;align-items:center;gap:6px;}
  .chip::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--spine)}
  .card .servings{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.78rem;color:var(--ink-soft);margin-left:auto;}
  .empty{padding:60px 4px;color:var(--ink-soft);max-width:52ch}
  .empty strong{color:var(--ink);font-weight:500}.empty a{color:var(--herb)}
  /* detail */
  .detail,.shop{display:none}
  .detail{padding:20px 0 90px}
  .back{display:inline-flex;align-items:center;gap:8px;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.9rem;background:none;border:0;color:var(--ink);cursor:pointer;padding:8px 0;margin:8px 0 26px;}
  .back:hover{color:var(--herb)}.back:focus-visible{outline:2.5px solid var(--honey);outline-offset:3px}
  .detail-head{border-left:6px solid var(--spine);padding-left:20px;margin-bottom:8px}
  .detail h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(2rem,6vw,3.2rem);line-height:1;letter-spacing:-.02em;margin:0;color:var(--herb-deep);}
  .detail .lede{margin:16px 0 0;font-size:1.18rem;max-width:62ch;color:var(--ink)}
  .detail-meta{display:flex;flex-wrap:wrap;gap:8px 12px;margin-top:20px;padding-left:20px}
  .detail-meta .chip{font-size:.82rem}
  .source{margin-top:18px;padding-left:20px;font-size:.92rem;color:var(--ink-soft)}
  .source a{color:var(--herb);text-underline-offset:3px}
  .hero{width:100%;aspect-ratio:16/10;object-fit:cover;border:1.5px solid var(--ink);border-radius:3px;margin-top:28px;display:block;}
  .video-embed{position:relative;aspect-ratio:16/9;border:1.5px solid var(--ink);border-radius:3px;overflow:hidden;margin-top:28px;background:#000;}
  .video-embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  .video-file{margin-top:28px}.video-file video{width:100%;max-height:74vh;border:1.5px solid var(--ink);border-radius:3px;background:#000;display:block}
  .video-link{margin-top:24px;display:inline-flex;align-items:center;gap:9px;font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.95rem;background:var(--herb);color:var(--paper);border-radius:2px;padding:11px 20px;text-decoration:none;}
  .video-link:hover{background:var(--herb-deep)}
  .body-grid{display:grid;grid-template-columns:minmax(0,340px) minmax(0,1fr);gap:52px;margin-top:44px;align-items:start;}
  .section-label{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1.15rem;color:var(--herb);margin:0 0 6px;padding-bottom:8px;border-bottom:2px solid var(--rule);}
  .ing-hint{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.74rem;color:var(--ink-soft);margin:0 0 12px}
  .ing-panel{background:var(--paper-2);border-radius:3px;padding:18px 18px 20px;position:sticky;top:20px}
  .ing-group + .ing-group{margin-top:16px}
  .ing-group h4{font-family:"Bricolage Grotesque",sans-serif;font-weight:600;font-size:.9rem;color:var(--berry);margin:6px 0 4px;padding:0 8px}
  .ing-panel ul{list-style:none;margin:0;padding:0}
  .ing-item{display:flex;gap:11px;align-items:flex-start;width:100%;text-align:left;background:none;border:0;cursor:pointer;
    font-family:inherit;color:var(--ink);font-size:1rem;line-height:1.4;padding:9px 8px;border-radius:4px;}
  .ing-item:hover{background:rgba(51,80,63,.08)}
  .ing-item:focus-visible{outline:2px solid var(--honey);outline-offset:-2px}
  .ing-item .tick{flex:none;width:19px;height:19px;border:1.6px solid var(--ink-soft);border-radius:5px;margin-top:1px;display:flex;align-items:center;justify-content:center}
  .ing-item .tick svg{width:12px;height:12px;stroke:var(--paper);stroke-width:3;opacity:0}
  .ing-item.added .tick{background:var(--herb);border-color:var(--herb)}
  .ing-item.added .tick svg{opacity:1}
  .ing-item.added{color:var(--herb-deep)}
  ol.steps{list-style:none;margin:0;padding:0;counter-reset:step}
  ol.steps li{counter-increment:step;position:relative;padding:0 0 26px 58px;margin:0}
  ol.steps li:not(:last-child){border-left:1.5px solid var(--rule);margin-left:16px;padding-left:42px}
  ol.steps li::before{content:counter(step);position:absolute;left:0;top:-4px;font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1rem;width:33px;height:33px;border-radius:50%;background:var(--herb);color:var(--paper);display:flex;align-items:center;justify-content:center;}
  ol.steps li:not(:last-child)::before{left:-17px}
  ol.steps li p{margin:2px 0 0}
  .note{margin-top:30px;background:var(--honey-soft);border-radius:3px;padding:20px 22px;font-size:.98rem;line-height:1.55;}
  .note b{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;color:var(--herb-deep);display:block;margin-bottom:4px;font-size:.9rem;}
  .jegyzet{margin-top:52px;border-top:2px solid var(--ink);padding-top:30px}
  .jegyzet .section-label{border:0;padding:0}
  .jegyzet-txt{max-width:66ch;margin-top:6px}.jegyzet-txt p{margin:0 0 1em}.jegyzet-txt p:last-child{margin-bottom:0}
  .gallery{margin-top:40px;display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
  .gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:3px;border:1px solid var(--rule)}
  /* shop */
  .shop{padding:22px 0 90px}
  .shop h1{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;font-size:clamp(1.8rem,6vw,2.8rem);line-height:1;letter-spacing:-.02em;margin:0 0 6px;color:var(--herb-deep)}
  .shop-sub{color:var(--ink-soft);margin:0 0 20px}
  .shop-controls{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 24px}
  .sbtn{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:.85rem;cursor:pointer;border-radius:3px;padding:9px 15px;border:1.5px solid var(--ink);background:none;color:var(--ink)}
  .sbtn.primary{background:var(--herb);border-color:var(--herb);color:var(--paper)}
  .sbtn:disabled{opacity:.4;cursor:default}
  .shop-group{margin-bottom:26px}
  .shop-group h3{font-family:"Bricolage Grotesque",sans-serif;font-weight:700;font-size:1rem;color:var(--herb);margin:0 0 4px;padding-bottom:6px;border-bottom:2px solid var(--rule)}
  .shop-item{display:flex;gap:13px;align-items:center;padding:11px 4px;border-bottom:1px solid var(--rule)}
  .shop-check{flex:none;width:24px;height:24px;border:1.7px solid var(--ink-soft);border-radius:6px;background:none;cursor:pointer;display:flex;align-items:center;justify-content:center;padding:0}
  .shop-check svg{width:15px;height:15px;stroke:var(--paper);stroke-width:3;opacity:0}
  .shop-item.kesz .shop-check{background:var(--herb);border-color:var(--herb)}
  .shop-item.kesz .shop-check svg{opacity:1}
  .shop-item .txt{flex:1;min-width:0;cursor:pointer}
  .shop-item.kesz .txt{text-decoration:line-through;color:var(--ink-soft)}
  .shop-remove{flex:none;background:none;border:0;cursor:pointer;color:var(--ink-soft);font-size:1.5rem;line-height:1;padding:2px 6px}
  .shop-remove:hover{color:var(--berry)}
  footer{border-top:2px solid var(--ink);padding:26px 0 60px;color:var(--ink-soft);font-size:.9rem}
  footer .wordmark-sm{font-family:"Bricolage Grotesque",sans-serif;font-weight:800;color:var(--herb-deep);font-size:1.1rem}
  @media(max-width:760px){
    body{font-size:17px}.wrap{padding:0 18px}header.masthead{padding:36px 0 16px}
    .body-grid{grid-template-columns:1fr;gap:36px}.ing-panel{position:static}
    .card .thumb{width:70px;height:70px}.card .servings{margin-left:0}
  }
  @media(prefers-reduced-motion:no-preference){.view-enter{animation:fade .28s ease both}@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}}
</style>
</head>
<body>
<div class="wrap">
  <header class="masthead">
    <button class="wordmark" id="home-link" aria-label="Vissza a receptek listájához">Receptfüzet</button>
    <p class="tagline">Kimentett receptek egy helyen — átírva magyarra, elolvasható mennyiségekkel és lépésekkel.</p>
  </header>

  <nav class="nav">
    <button class="tab active" id="tab-receptek">Receptek</button>
    <button class="tab" id="tab-shop">Bevásárlólista <span class="badge zero" id="shop-badge">0</span></button>
    <a class="tab right" href="szerkeszto.html">Szerkesztő</a>
  </nav>

  <div id="list-view">
    <div class="controls">
      <label class="search">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="search" type="search" placeholder="Keresés recept vagy hozzávaló szerint…" autocomplete="off" aria-label="Keresés">
      </label>
      <div class="tagbar" id="tagbar" role="group" aria-label="Szűrés címke szerint"></div>
    </div>
    <main><ul class="index" id="index"></ul><div class="empty" id="empty" hidden></div></main>
  </div>

  <div class="detail" id="detail-view" aria-live="polite"></div>
  <div class="shop" id="shop-view"></div>

  <footer><span class="wordmark-sm">Receptfüzet</span> · saját gyűjtemény</footer>
</div>

<script src="recipes.js"></script>
<script>
const RECEPTEK=(window.RECEPTEK||[]);
const SZINEK={"vegetáriánus":"#33503F","köret":"#B0752A","édesburgonya":"#B26A3A","gluténmentes":"#4B6B57","desszert":"#7A3B52","leves":"#516A86","reggeli":"#8A6D2F","főétel":"#8A4B34","marha":"#6E4A6B"};
const szinehez=t=>SZINEK[t]||"#33503F";
const CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>';
function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")}
function norm(s){return String(s==null?"":s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"")}
function formaz(txt){return txt.split(/\n\s*\n/).map(p=>"<p>"+esc(p).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/\n/g,"<br>")+"</p>").join("")}
function videoBlokk(v){
  if(!v)return"";
  const yt=v.match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?v=|embed\/|shorts\/))([\w-]{11})/);
  if(yt)return `<div class="video-embed"><iframe src="https://www.youtube.com/embed/${yt[1]}" title="Videó" allow="accelerometer;autoplay;clipboard-write;encrypted-media;gyroscope;picture-in-picture" allowfullscreen loading="lazy"></iframe></div>`;
  const vi=v.match(/vimeo\.com\/(\d+)/);
  if(vi)return `<div class="video-embed"><iframe src="https://player.vimeo.com/video/${vi[1]}" title="Videó" allowfullscreen loading="lazy"></iframe></div>`;
  if(/\.(mp4|webm|ogg)(\?|#|$)/i.test(v))return `<div class="video-file"><video controls preload="metadata" src="${esc(v)}"></video></div>`;
  return `<a class="video-link" href="${esc(v)}" target="_blank" rel="noopener">▶ Videó megtekintése</a>`;
}

/* ---- bevásárlólista tár (localStorage, memória-fallback) ---- */
const KEY="receptfuzet_bevasarlo";
let _mem=[];
function listaBetolt(){try{const s=localStorage.getItem(KEY);return s?JSON.parse(s):[];}catch(e){return _mem;}}
function listaMent(v){_mem=v;try{localStorage.setItem(KEY,JSON.stringify(v));}catch(e){}}
let bevasarlo=listaBetolt();
let uidSeq=1; bevasarlo.forEach(x=>{if(!x.uid)x.uid=uidSeq++;}); uidSeq=Math.max(uidSeq,...bevasarlo.map(x=>x.uid||0))+1;
function inList(recept,szoveg){return bevasarlo.some(x=>x.recept===recept&&x.szoveg===szoveg)}
function frissitBadge(){const b=document.getElementById("shop-badge");const n=bevasarlo.length;b.textContent=n;b.classList.toggle("zero",n===0);}

/* ---- állapot ---- */
let aktivCimkek=new Set(), kereso="";
const $index=document.getElementById("index"),$empty=document.getElementById("empty"),$tagbar=document.getElementById("tagbar"),
  $search=document.getElementById("search"),$listView=document.getElementById("list-view"),
  $detailView=document.getElementById("detail-view"),$shopView=document.getElementById("shop-view");
RECEPTEK.forEach((r,i)=>r._id=i);

const osszesCimke=[...new Set(RECEPTEK.flatMap(r=>r.cimkek||[]))];
osszesCimke.forEach(t=>{
  const b=document.createElement("button");b.className="tagfilter";b.textContent=t;b.setAttribute("aria-pressed","false");
  b.onclick=()=>{if(aktivCimkek.has(t))aktivCimkek.delete(t);else aktivCimkek.add(t);
    b.setAttribute("aria-pressed",aktivCimkek.has(t));render();};
  $tagbar.appendChild(b);
});

function szurt(){
  const toks=norm(kereso.trim()).split(/\s+/).filter(Boolean);
  return RECEPTEK.filter(r=>{
    if(aktivCimkek.size){for(const t of aktivCimkek){if(!(r.cimkek||[]).includes(t))return false;}}
    if(!toks.length)return true;
    const heap=norm([r.cim,r.leiras,(r.cimkek||[]).join(" "),(r.hozzavalok||[]).flatMap(g=>g.tetelek).join(" "),r.szoveg||""].join(" "));
    return toks.every(t=>heap.includes(t));
  });
}

function render(){
  const lista=szurt();$index.innerHTML="";
  if(!RECEPTEK.length){$empty.hidden=false;$empty.innerHTML=`Még nincs recept, vagy a <code>recipes.js</code> nem töltődött be. Nyisd meg a <a href="szerkeszto.html">Szerkesztőt</a>.`;return;}
  if(!lista.length){$empty.hidden=false;$empty.innerHTML=`Nincs találat. Töröld a keresést vagy a szűrőt.`;return;}
  $empty.hidden=true;
  lista.forEach(r=>{
    const spine=szinehez((r.cimkek||[])[0]);
    const li=document.createElement("li");const b=document.createElement("button");
    b.className="card";b.style.setProperty("--spine",spine);
    const thumb=r.kep?`<img class="thumb" src="${esc(r.kep)}" alt="" loading="lazy">`:"";
    b.innerHTML=`<div class="card-txt"><h2>${esc(r.cim)}</h2><p class="desc">${esc(r.leiras)}</p>
      <div class="meta">${(r.cimkek||[]).map(t=>`<span class="chip" style="--spine:${szinehez(t)}">${esc(t)}</span>`).join("")}
      ${r.video?`<span class="playtag">▶ videó</span>`:""}${r.adag?`<span class="servings">${esc(r.adag)}</span>`:""}</div></div>${thumb}`;
    b.onclick=()=>megnyit(r._id);li.appendChild(b);$index.appendChild(li);
  });
}

function ingToggle(recept,szoveg,btn){
  const i=bevasarlo.findIndex(x=>x.recept===recept&&x.szoveg===szoveg);
  if(i>=0){bevasarlo.splice(i,1);btn.classList.remove("added");btn.setAttribute("aria-pressed","false");}
  else{bevasarlo.push({uid:uidSeq++,recept,szoveg,kesz:false});btn.classList.add("added");btn.setAttribute("aria-pressed","true");}
  listaMent(bevasarlo);frissitBadge();
}

function megnyit(id){
  const r=RECEPTEK.find(x=>x._id===id);const spine=szinehez((r.cimkek||[])[0]);
  $detailView.style.setProperty("--spine",spine);
  const media=r.kep?`<img class="hero" src="${esc(r.kep)}" alt="${esc(r.cim)}">`:"";
  const galeria=(r.galeria&&r.galeria.length)?`<div class="gallery">${r.galeria.map(g=>`<img src="${esc(g)}" alt="" loading="lazy">`).join("")}</div>`:"";
  const flat=[];
  const ingHtml=(r.hozzavalok||[]).map(g=>`<div class="ing-group">${g.csoport?`<h4>${esc(g.csoport)}</h4>`:""}<ul>${
    (g.tetelek||[]).map(t=>{flat.push(t);const a=inList(r.cim,t);
      return `<li><button class="ing-item${a?' added':''}" aria-pressed="${a}"><span class="tick">${CHECK}</span><span>${esc(t)}</span></button></li>`;}).join("")
  }</ul></div>`).join("");
  $detailView.innerHTML=`
    <button class="back" id="back"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M15 18l-6-6 6-6"/></svg>Minden recept</button>
    <div class="detail-head"><h1>${esc(r.cim)}</h1></div>
    <p class="lede">${esc(r.leiras)}</p>
    <div class="detail-meta">${(r.cimkek||[]).map(t=>`<span class="chip" style="--spine:${szinehez(t)}">${esc(t)}</span>`).join("")}${r.adag?`<span class="chip" style="--spine:var(--ink-soft)">${esc(r.adag)}</span>`:""}</div>
    ${r.forras?`<p class="source">Forrás: ${r.forrasUrl?`<a href="${esc(r.forrasUrl)}" target="_blank" rel="noopener">${esc(r.forras)}</a>`:esc(r.forras)}</p>`:""}
    ${media}${videoBlokk(r.video)}
    <div class="body-grid">
      <div><h3 class="section-label">Hozzávalók</h3><p class="ing-hint">Koppints egy hozzávalóra → bevásárlólista</p><div class="ing-panel">${ingHtml}</div></div>
      <div><h3 class="section-label">Elkészítés</h3><ol class="steps">${(r.lepesek||[]).map(s=>`<li><p>${esc(s)}</p></li>`).join("")}</ol>
        ${r.megjegyzes?`<div class="note"><b>Megjegyzés</b>${esc(r.megjegyzes)}</div>`:""}</div>
    </div>${galeria}
    ${r.szoveg?`<div class="jegyzet"><h3 class="section-label">Jegyzetek</h3><div class="jegyzet-txt">${formaz(r.szoveg)}</div></div>`:""}`;
  document.getElementById("back").onclick=zar;
  const btns=$detailView.querySelectorAll(".ing-item");
  btns.forEach((b,i)=>{b.onclick=()=>ingToggle(r.cim,flat[i],b);});
  showView("detail");
  $detailView.classList.remove("view-enter");void $detailView.offsetWidth;$detailView.classList.add("view-enter");
  window.scrollTo(0,0);
  history.pushState({id},"","#"+encodeURIComponent(r.cim.toLowerCase().replace(/\s+/g,"-")));
}

/* ---- bevásárlólista nézet ---- */
function shopRender(){
  frissitBadge();
  if(!bevasarlo.length){
    $shopView.innerHTML=`<div class="shop"><h1>Bevásárlólista</h1><div class="empty">Még üres. Nyiss meg egy receptet, és koppints a hozzávalókra, hogy ide kerüljenek. Több receptből is gyűjthetsz egyszerre.</div></div>`;
    return;
  }
  const groups={},order=[];
  bevasarlo.forEach(it=>{if(!groups[it.recept]){groups[it.recept]=[];order.push(it.recept);}groups[it.recept].push(it);});
  const megvett=bevasarlo.filter(x=>x.kesz).length;
  $shopView.innerHTML=`<div class="shop">
    <h1>Bevásárlólista</h1>
    <p class="shop-sub">${bevasarlo.length} tétel${megvett?` · ${megvett} megvéve`:""}</p>
    <div class="shop-controls">
      <button class="sbtn primary" id="rem-done" ${megvett?"":"disabled"}>Megvettek eltávolítása (${megvett})</button>
      <button class="sbtn" id="clear-all">Teljes lista törlése</button>
    </div>
    ${order.map(rec=>`<div class="shop-group"><h3>${esc(rec)}</h3>${
      groups[rec].map(it=>`<div class="shop-item${it.kesz?' kesz':''}" data-uid="${it.uid}">
        <button class="shop-check" data-toggle="${it.uid}" aria-label="Megvéve">${CHECK}</button>
        <span class="txt" data-toggle="${it.uid}">${esc(it.szoveg)}</span>
        <button class="shop-remove" data-remove="${it.uid}" aria-label="Törlés">×</button>
      </div>`).join("")
    }</div>`).join("")}
  </div>`;
  $shopView.querySelectorAll("[data-toggle]").forEach(n=>n.onclick=()=>{
    const uid=+n.getAttribute("data-toggle");const it=bevasarlo.find(x=>x.uid===uid);
    if(it){it.kesz=!it.kesz;listaMent(bevasarlo);shopRender();}
  });
  $shopView.querySelectorAll("[data-remove]").forEach(n=>n.onclick=()=>{
    const uid=+n.getAttribute("data-remove");bevasarlo=bevasarlo.filter(x=>x.uid!==uid);listaMent(bevasarlo);shopRender();
  });
  document.getElementById("rem-done").onclick=()=>{bevasarlo=bevasarlo.filter(x=>!x.kesz);listaMent(bevasarlo);shopRender();};
  document.getElementById("clear-all").onclick=()=>{if(confirm("Biztosan törlöd az egész bevásárlólistát?")){bevasarlo=[];listaMent(bevasarlo);shopRender();}};
}

/* ---- nézetváltás ---- */
function showView(v){
  $listView.style.display=v==="list"?"block":"none";
  $detailView.style.display=v==="detail"?"block":"none";
  $shopView.style.display=v==="shop"?"block":"none";
  document.getElementById("tab-receptek").classList.toggle("active",v!=="shop");
  document.getElementById("tab-shop").classList.toggle("active",v==="shop");
}
function zar(){showView("list");window.scrollTo(0,0);if(location.hash)history.pushState({},"",location.pathname);}

document.getElementById("home-link").onclick=zar;
document.getElementById("tab-receptek").onclick=zar;
document.getElementById("tab-shop").onclick=()=>{shopRender();showView("shop");window.scrollTo(0,0);};
$search.addEventListener("input",e=>{kereso=e.target.value;render();});
window.addEventListener("popstate",e=>{if(e.state&&e.state.id!=null)megnyit(e.state.id);else zar();});

frissitBadge();render();
</script>
</body>
</html>
